<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Billetera Lite</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#111111">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
    <header>
        <div class="header-top">
            <h1>Billetera<span class="dot">.</span></h1>
        </div>
        <div class="total-block">
            <span class="total-label">Total gastado</span>
            <span id="total-display" class="total-value">$0.00</span>
        </div>
    </header>

    <main>
        <form id="expense-form">
            <div class="field">
                <label for="concepto">Concepto</label>
                <input type="text" id="concepto" placeholder="Ej. Café" required>
            </div>

            <div class="row">
                <div class="field">
                    <label for="monto">Monto</label>
                    <input type="number" id="monto" placeholder="0.00" step="0.01" min="0.01" required>
                </div>
                <div class="field">
                    <label for="categoria">Categoría</label>
                    <select id="categoria" required>
                        <option value="">Elegir</option>
                        <option value="Comida">Comida</option>
                        <option value="Transporte">Transporte</option>
                        <option value="Servicios">Servicios</option>
                        <option value="Ocio">Ocio</option>
                        <option value="Otros">Otros</option>
                    </select>
                </div>
            </div>

            <button type="submit">
                <span>Agregar gasto</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
            </button>
        </form>

        <section id="historial">
            <div class="section-head">
                <h2>Historial</h2>
                <span class="count" id="count-display">0</span>
            </div>
            <ul id="lista-gastos">
                <!-- Aquí se inyectarán los gastos con JS -->
            </ul>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
